name: foundation-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.ts
      - run: node --check apps/web/public/app.js
      - run: python3 -m unittest discover -s workers/media -v
# Runtime-only CI; typecheck and ffprobe skip status must be reviewed separately.
# No secrets, npm install, paid APIs, generation, workflow writes or deployment.
