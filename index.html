<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер привычек</title>
<style>
  :root{--bg:#f6f5f1;--card:#ffffff;--text:#1a1a1a;--muted:#8a8a8a;--line:#ececec;--accent:#111;--accent2:#ff3b30;--radius:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 40px}
  header{margin-bottom:18px}
  h1{font-size:28px;letter-spacing:-0.03em;font-weight:800}
  h1 span{font-weight:400;color:var(--muted)}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .add{display:flex;gap:8px}
  .add input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;background:#fbfbfb}
  .add input:focus{border-color:#111;background:#fff}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-dark{background:var(--accent);color:#fff}
  .btn-dark:active{transform:scale(.98)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
  .stats{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .stat b{font-size:22px;line-height:1}
  .stat span{color:var(--muted);font-size:12px;display:block;margin-top:2px}
  .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .habit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:flex;gap:12px;align-items:flex-start}
  .check{width:26px;height:26px;border-radius:8px;border:2px solid #ddd;display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin-top:2px;background:#fff;transition:.15s}
  .check.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .habit-main{flex:1;min-width:0}
  .habit-name{font-weight:650;font-size:15px;word-break:break-word}
  .habit-meta{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dots{display:flex;gap:4px;margin-top:8px}
  .dot{width:18px;height:18px;border-radius:6px;background:#f0f0f0;border:1px solid #eee}
  .dot.on{background:var(--accent);border-color:var(--accent)}
  .dot.today{outline:2px solid var(--accent);outline-offset:1px}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:#999}
  .icon-btn:hover{color:var(--accent2);border-color:#ffd6d3}
  .empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}
  .foot{color:#aaa;font-size:12px;text-align:center;margin-top:16px}
  .date{font-size:12px;color:var(--muted);margin:10px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Трекер <span>привычек</span></h1>
    <div class="sub" id="todayLabel"></div>
  </header>

  <div class="card add">
    <input id="input" placeholder="Новая привычка — напр. Зарядка 10 мин" maxlength="40" autocomplete="off">
    <button class="btn btn-dark" id="addBtn">Добавить</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sDone">0</b><span>выполнено сегодня</span></div>
    <div class="stat"><b id="sTotal">0</b><span>всего привычек</span></div>
    <div class="stat"><b id="sStreak">0</b><span>лучшая серия</span></div>
  </div>

  <div class="date" id="weekLabel"></div>
  <div class="list" id="list"></div>

  <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
    <button class="btn btn-ghost" id="clearDone">Снять все на сегодня</button>
    <button class="btn btn-ghost" id="resetBtn" title="Удалить все привычки">Сбросить</button>
  </div>

  <div class="foot">Данные хранятся локально в браузере · без регистрации</div>
</div>

<script>
const KEY = 'habits_simple_v1';
const $ = s => document.querySelector(s);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d.toLocaleDateString('ru-RU',{weekday:'long', day:'numeric', month:'long'});

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || [] } catch{ return []}
}
function save(data){ localStorage.setItem(KEY, JSON.stringify(data)) }

let habits = load();
if(habits.length===0){
  habits = [
    {id:'1', name:'Вода 1.5 л', done:{}},
    {id:'2', name:'Прогулка 20 мин', done:{}},
    {id:'3', name:'Чтение 15 мин', done:{}},
  ];
  save(habits);
}

function streak(h){
  let s=0; let d=new Date();
  for(let i=0;i<365;i++){
    const k=d.toISOString().slice(0,10);
    if(h.done[k]) s++; else if(i>0) break; // серия до сегодня включительно, разрыв — стоп
    d.setDate(d.getDate()-1);
  }
  return s;
}
function bestStreak(h){
  // максимальная серия за всё время
  const dates = Object.keys(h.done).filter(k=>h.done[k]).sort();
  if(!dates.length) return 0;
  let best=1, cur=1;
  for(let i=1;i<dates.length;i++){
    const a=new Date(dates[i-1]), b=new Date(dates[i]);
    const diff=(b-a)/86400000;
    if(diff===1) cur++; else cur=1;
    best=Math.max(best,cur);
  }
  return best;
}
function last7(){
  const arr=[]; const d=new Date();
  for(let i=6;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); arr.push(x.toISOString().slice(0,10)) }
  return arr;
}

function render(){
  const t = todayStr();
  $('#todayLabel').textContent = fmtDate(new Date()) + ' · ' + t;
  const d7 = last7();
  $('#weekLabel').textContent = 'Последние 7 дней — точки слева направо, обведена сегодня';

  const list = $('#list');
  list.innerHTML = '';
  if(habits.length===0){
    list.innerHTML = '<div class="card empty">Пока пусто. Добавьте первую привычку выше ↑</div>';
  }
  habits.forEach(h=>{
    const doneToday = !!h.done[t];
    const s = streak(h);
    const el = document.createElement('div');
    el.className='habit';
    el.innerHTML = `
      <button class="check ${doneToday?'done':''}" aria-label="отметить">${doneToday?'✓':''}</button>
      <div class="habit-main">
        <div class="habit-name">${escapeHtml(h.name)}</div>
        <div class="habit-meta"><span>${doneToday?'выполнено':'не выполнено'}</span> · <span>серия ${s} дн.</span> · <span>лучшая ${bestStreak(h)}</span></div>
        <div class="dots">${d7.map(k=>`<span class="dot ${h.done[k]?'on':''} ${k===t?'today':''}" title="${k}"></span>`).join('')}</div>
      </div>
      <button class="icon-btn" title="Удалить">✕</button>
    `;
    el.querySelector('.check').onclick=()=>{
      h.done[t]=!h.done[t];
      if(!h.done[t]) delete h.done[t];
      save(habits); render();
    };
    el.querySelector('.icon-btn').onclick=()=>{
      if(confirm(`Удалить «${h.name}»?`)){ habits=habits.filter(x=>x.id!==h.id); save(habits); render(); }
    };
    list.appendChild(el);
  });

  const doneCount = habits.filter(h=>h.done[t]).length;
  $('#sDone').textContent = doneCount;
  $('#sTotal').textContent = habits.length;
  const best = habits.reduce((m,h)=>Math.max(m,bestStreak(h)),0);
  $('#sStreak').textContent = best;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }

function addHabit(){
  const v = $('#input').value.trim();
  if(!v) return;
  habits.unshift({id:Date.now().toString(36), name:v, done:{}});
  $('#input').value='';
  save(habits); render();
}

$('#addBtn').onclick=addHabit;
$('#input').addEventListener('keydown',e=>{ if(e.key==='Enter') addHabit() });
$('#clearDone').onclick=()=>{
  const t=todayStr();
  habits.forEach(h=> delete h.done[t]);
  save(habits); render();
};
$('#resetBtn').onclick=()=>{
  if(confirm('Удалить все привычки?')){ habits=[]; save(habits); render(); }
};

render();
</script>
</body>
</html>
